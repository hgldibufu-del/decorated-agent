# =============================================================================
# Alembic configuration.
# NOTE: keep this file ASCII-only. Alembic reads it with the OS locale codec
# (GBK on Windows), which fails on non-ASCII bytes.
#
# Connection string intentionally NOT here: alembic/env.py reads it from
# dw_infrastructure.Settings so there is exactly one source of truth.
# =============================================================================

[alembic]
script_location = alembic
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
version_path_separator = os
# placeholder, overridden by env.py at runtime
sqlalchemy.url =

# compare_type=True lets autogenerate detect column type changes
[autogenerate]
compare_type = True
