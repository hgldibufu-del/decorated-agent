[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dw-schemas"
version = "0.1.0"
description = "装修 AI Agent Workbench：跨 app/package 共享的 Pydantic 契约"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dw_schemas = ["py.typed"]
