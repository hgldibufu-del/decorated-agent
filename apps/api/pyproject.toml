[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dw-api"
version = "0.1.0"
description = "装修 AI Agent Workbench：FastAPI 接入层"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "dw-schemas",
    "dw-infrastructure",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "httpx>=0.27"]

[project.scripts]
dw-api = "dw_api.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dw_api = ["py.typed"]
