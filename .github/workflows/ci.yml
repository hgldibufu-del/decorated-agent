name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 后端：lint + 类型 + 测试（含真实 Postgres / Redis / Kafka 集成测试）
  # ---------------------------------------------------------------------------
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compose 配置校验
        run: docker compose config --quiet

      # 复用与本地完全相同的 compose 文件，避免 CI 与本地环境漂移
      - name: 启动基础设施
        run: docker compose up -d --wait

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # 集成测试依赖业务表，必须在跑测试前建好
      - name: 应用数据库迁移
        run: alembic upgrade head

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: 类型检查
        run: mypy apps packages

      - name: 测试
        run: pytest -q

      - name: 打印容器状态（失败时便于排查）
        if: failure()
        run: docker compose ps

      - name: 清理基础设施
        if: always()
        run: docker compose down -v

  # ---------------------------------------------------------------------------
  # 前端：类型 + 单测 + 构建
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 测试
        run: npm test

      - name: 构建
        run: npm run build

  # ---------------------------------------------------------------------------
  # 镜像：确保 Dockerfile 与 monorepo 路径依赖仍可安装
  # ---------------------------------------------------------------------------
  image:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 构建 API 镜像
        run: docker build -t dw-api:ci .
