# =============================================================================
# 装修企业 AI Agent Workbench —— workspace root
# -----------------------------------------------------------------------------
# 本文件只存放「工作区级工具配置」（lint / format / type / test）。
# 每个 app / package 各自持有独立的 pyproject.toml（独立分发、独立依赖边界）。
#
# 目录职责（见 docs/architecture.md）:
#   apps/api              FastAPI 接入层
#   packages/schemas      跨进程共享的 Pydantic 契约
#   packages/infrastructure  基础设施适配器（DB / Redis / Kafka / 配置 / 日志）
# =============================================================================

# -----------------------------------------------------------------------------
# Ruff: lint + format (替代 black / isort / flake8)
# -----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["apps", "packages", "tests"]
exclude = [".venv", "node_modules"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "ASYNC",  # flake8-async
    "RUF",    # ruff 自有规则
]
ignore = [
    "B008",   # FastAPI 依赖项默认值需要函数调用
    # RUF001/002/003 会对中文与制表符（→ ✓ ─）告警。本项目面向中文团队，
    # 注释 / 文档字符串 / 文案里出现 CJK 与流程图字符是刻意的，故整体关闭。
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# -----------------------------------------------------------------------------
# Mypy
# -----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
show_error_codes = true

# -----------------------------------------------------------------------------
# Pytest
# -----------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers --strict-config"
pythonpath = [
    "apps/api/src",
    "apps/agent-runtime/src",
    "apps/mcp-server/src",
    "packages/schemas/src",
    "packages/infrastructure/src",
    "packages/domain/src",
]
markers = [
    "integration: 需要真实的 Postgres / Redis / Kafka（由 docker compose 提供）",
]
filterwarnings = ["ignore::DeprecationWarning"]
